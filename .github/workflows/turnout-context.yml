name: Audit and screen turnout context
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*turnout_context*'
      - 'tests/test_turnout_context.py'
      - 'config/turnout-context.json'
      - 'data/snapshots/turnout-context-2026-10-25/**'
      - 'reports/turnout-context-2026-10-25/**'
      - '.github/workflows/turnout-context.yml'
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Collect primary demographic source snapshot when absent
        if: ${{ hashFiles('data/snapshots/turnout-context-2026-10-25/worldbank/manifest.json') == '' }}
        run: python scripts/collect_turnout_context.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: turnout-context
          path: output/turnout-context*/
          if-no-files-found: error
          retention-days: 30
