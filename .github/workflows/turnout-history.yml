name: Analyze historical turnout
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/turnout_history.py'
      - 'tests/test_turnout_history.py'
      - 'data/snapshots/turnout-history-2026-10-24/**'
      - 'reports/turnout-history-2026-10-24/**'
      - '.github/workflows/turnout-history.yml'
permissions:
  contents: read
jobs:
  turnout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Test time boundaries, denominators and turnout bounds
        run: python -m unittest discover -s tests -p test_turnout_history.py -v
      - name: Reproduce turnout analysis
        run: |
          python scripts/turnout_history.py
          python scripts/turnout_history.py --out-dir output/turnout-repeat > output/turnout-repeat.log
          for file in analysis.md results.json history.csv backtest.csv turnout-history.svg turnout-errors.svg inputs-manifest.json; do
            diff -u "output/turnout-history/$file" "output/turnout-repeat/$file"
            if [ -d reports/turnout-history-2026-10-24 ]; then
              diff -u "reports/turnout-history-2026-10-24/$file" "output/turnout-history/$file"
            fi
          done
          cat output/turnout-history/analysis.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: turnout-history
          path: output/turnout-history/
          if-no-files-found: error
          retention-days: 30
