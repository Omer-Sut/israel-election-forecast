name: Read saved E022 artifact for analysis
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e022-artifact-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download existing result without rerunning experiments
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40317447939 --repo Omer-Sut/israel-election-forecast --name diversity-bands-E022 --dir output/e022-review
      - name: Print saved report and lossless evidence
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          root=Path('output/e022-review')
          names=['START_HERE.md','results.json','diversity.csv','current-bands.svg','diversity.svg','inputs-manifest.json','environment.txt']
          files={n:(root/n).read_text(encoding='utf-8') for n in names}
          print(files['START_HERE.md'])
          print('FILE_HASHES',json.dumps({n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in names}))
          encoded=base64.b64encode(gzip.compress(json.dumps(files,ensure_ascii=False).encode())).decode()
          print('E022_REVIEW_BASE64_BEGIN')
          for i in range(0,len(encoded),7000):print(encoded[i:i+7000])
          print('E022_REVIEW_BASE64_END')
          PY
