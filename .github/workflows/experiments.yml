name: Screen lightweight forecast models

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/experiments.py'
      - 'scripts/prepare_screening_panel.py'
      - 'scripts/campaign_history.py'
      - 'scripts/robustness.py'
      - 'scripts/research_trial.py'
      - 'scripts/*diagnostics.mjs'
      - 'tests/test_experiments.py'
      - 'tests/test_campaign_history.py'
      - 'tests/test_robustness.py'
      - 'tests/test_research_trial.py'
      - 'config/**'
      - 'data/snapshots/**'
      - 'requirements-experiments.txt'
      - '.github/workflows/experiments.yml'

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      REQUIRE_EXPERIMENT_DEPS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - name: Install locked CPU experiment dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-experiments.txt
          python -m pip check
      - name: Run contract, leakage and model smoke tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild reviewed six-election panel offline
        run: |
          python scripts/prepare_screening_panel.py --out-dir output/panel-rebuild
          diff -ru data/snapshots/screening-six-elections-2026-10-21/prepared output/panel-rebuild
      - name: Run exploratory historical diagnostics and synthetic smoke checks
        run: python scripts/experiments.py --out-dir output/experiments
      - name: Verify deterministic predictions on a second run
        run: |
          python scripts/experiments.py --out-dir output/experiments-repeat
          diff -u output/experiments/predictions.csv output/experiments-repeat/predictions.csv
          diff -u output/experiments/smoke.json output/experiments-repeat/smoke.json
          diff -u output/experiments/summary.md output/experiments-repeat/summary.md
      - name: Preserve installed environment and show report
        run: |
          python -m pip freeze > output/experiments/environment.txt
          cat output/experiments/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run data-only campaign-history sensitivities on hosted CPU
        run: |
          python scripts/campaign_history.py --out-dir output/campaign-history
          python scripts/campaign_history.py --out-dir output/campaign-history-repeat
          for variant in reference publication_age expanded_history expanded_publication_age; do
            diff -u "output/campaign-history/$variant/results/predictions.csv" "output/campaign-history-repeat/$variant/results/predictions.csv"
          done
          node scripts/compare_campaign_diagnostics.mjs output/campaign-history
          cat output/campaign-history/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve campaign-history sensitivities and pre-rounding plots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: campaign-history-sensitivities
          path: output/campaign-history/
          if-no-files-found: error
          retention-days: 30
      - name: Run bounded correction and forest-seed robustness batch
        run: |
          python scripts/robustness.py
          cat output/robustness/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run poll accuracy, chronological tuning and feature-readiness trial
        run: |
          python scripts/research_trial.py
          cat output/research-trial/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded research trial
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: poll-quality-and-feature-trial
          path: |
            output/research-trial/*.csv
            output/research-trial/*.json
            output/research-trial/*.html
            output/research-trial/*.svg
            output/research-trial/*.md
            output/research-trial/inputs/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve robustness plots, predictions and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: robustness-correction-seeds
          path: output/robustness/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lightweight-model-screen
          path: output/experiments/
          if-no-files-found: warn
          retention-days: 30

