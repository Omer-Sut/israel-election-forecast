name: Reproduce preliminary baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Test decision and contract logic
        run: python -m unittest discover -s tests -v
      - name: Check saved prediction diagnostics without refitting
        run: node tests/test_screening_diagnostics.mjs
      - name: Reproduce baseline from frozen inputs
        run: python scripts/baseline.py --out-dir output/baseline
      - name: Check durable snapshot reproduction
        run: diff -ru reports/baseline-2026-10-21 output/baseline
      - name: Reproduce historical backtest from frozen inputs
        run: python scripts/backtest.py --out-dir output/backtest
      - name: Build and validate portable historical database offline
        run: python scripts/build_database.py
      - name: Check frozen database coverage and input hashes
        run: diff -u reports/cbs-2026-10-21/database-coverage.json output/elections.coverage.json
      - name: Reproduce CBS descriptive geographic linkage
        run: |
          python scripts/cbs_report.py
          diff -u reports/cbs-2026-10-21/cbs-linkage.json output/cbs-linkage.json
      - name: Check historical backtest reproduction
        run: diff -ru reports/backtest-2026-10-21 output/backtest
      - name: Reproduce separate current poll audit
        run: |
          python scripts/current_poll_audit.py --out-dir output/current-poll-audit
          python scripts/current_poll_audit.py --out-dir output/current-poll-audit-repeat > /dev/null
          diff -ru output/current-poll-audit output/current-poll-audit-repeat
          python -c "import json; from pathlib import Path; print('E007_FILES_JSON=' + json.dumps({p.name:p.read_text(encoding='utf-8') for p in sorted(Path('output/current-poll-audit').iterdir())}, ensure_ascii=False))"
          if [ -d reports/current-poll-audit-2026-10-23 ]; then
            diff -ru reports/current-poll-audit-2026-10-23 output/current-poll-audit
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: current-poll-audit
          path: output/current-poll-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Show results in the run summary
        run: |
          cat output/baseline/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat output/backtest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preliminary-baseline
          path: output/baseline/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: historical-election-database
          path: |
            output/elections.sqlite
            output/elections.coverage.json
            output/cbs-linkage.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: historical-backtest-pilot
          path: output/backtest/
          if-no-files-found: error
          retention-days: 30
