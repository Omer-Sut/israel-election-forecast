name: Prepare forecast review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/forecast_review.py'
      - 'tests/test_forecast_review.py'
      - 'config/forecast-review.json'
      - 'data/snapshots/polls-2026-10-24.json'
      - 'reports/forecast-review-2026-10-24/**'
      - '.github/workflows/forecast-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check decision assumptions and source cutoffs
        run: python -m unittest discover -s tests -p test_forecast_review.py -v
      - name: Prepare decisions and historical threshold comparison
        run: |
          python scripts/forecast_review.py
          python scripts/forecast_review.py --out-dir output/forecast-review-repeat > output/forecast-review-repeat.log
          for file in review.json seat-options.csv summary.md decision-sensitivity.svg method-draft.txt inputs-manifest.json; do
            diff -u "output/forecast-review/$file" "output/forecast-review-repeat/$file"
            if [ -d reports/forecast-review-2026-10-24 ]; then
              diff -u "reports/forecast-review-2026-10-24/$file" "output/forecast-review/$file"
            fi
          done
          cat output/forecast-review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: forecast-review
          path: output/forecast-review/
          if-no-files-found: error
          retention-days: 30
